name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install "ruff>=0.15,<0.16"
      # Start with correctness rules while historical style debt is reduced.
      - run: ruff check --select E9,F63,F7,F82 src tests

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -r requirements.txt
          "pytest>=9,<10" "pytest-cov>=4,<8"
          "pytest-asyncio>=0.23,<2" "httpx>=0.28,<0.29"
      - run: pytest -m "not slow and not network"

  javascript-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.mjs
